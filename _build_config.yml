url: ""
baseurl: ""
destination: "localserver"
theme: chulapa-jekyll
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
pure_relative_paths: true

collections:
  pages:
    output: true
    permalink: /:path/
