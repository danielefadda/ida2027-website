# IDA 2027 — 25th International Symposium on Intelligent Data Analysis

title: "IDA 2027"
subtitle: "25th International Symposium on Intelligent Data Analysis"
email: "ida2027@conference.org"
description: >-
  IDA 2027: 25th International Symposium on Intelligent Data Analysis.
  Advancing Intelligent Data Analysis with novel, potentially game-changing ideas.

markdown: kramdown

remote_theme: "dieghernan/chulapa"

navbar:
  style: dual
  brand:
    title: ""
    img: "./assets/images/ida2027-logo-white.svg"
    url: /
  nav:
    - title: Home
      url: /
    - title: Submissions
      child:
        - title: Why Submit to IDA?
          url: /why-submit/
        - title: Regular Paper Track
          url: /regular-paper-track/
        - title: PhD Forum
          url: /phd-forum/
    - title: Programme
      child:
        - title: Programme Overview
          url: /programme-overview/
        - title: Accepted Papers
          url: /accepted-papers/
        - title: Invited Speakers
          url: /invited-speakers/
        - title: Social Programme
          url: /social-programme/
    - title: Organization
      child:
        - title: Chairs
          url: /chairs/
    - title: Attending
      child:
        - title: Venue & Travel
          url: /venue-and-travel/
        - title: Registration
          url: /registration/
    - title: Submission System
      url: https://cmt3.research.microsoft.com/IDA2027/
      target: _blank

googlefonts:
  - url: "https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&display=swap"

chulapa-skin:
  skin: "graymor"
  vars:
    body-color: "#000"
    body-bg: "#fff"
    footer-chulapa-bg-color: "#000"
    footer-chulapa-text-color: "#fff"
    navbar-chulapa-bg-color: "#000"
    navbar-chulapa-text-color: "#fff"
    primary: "#000"
    link-color: "#e87722"
    link-hover-color: "#e87722"
    link-decoration: "underline"
    headings-font-family: "open sans, sans-serif"

##################################################
#    System Configuration (DO NOT MODIFY)
##################################################

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

collections:
  pages:
    output: true
    permalink: /:path/

footer:
  links:
    - label: "Bluesky"
      icon: "fab fa-bluesky"
      url: "https://bsky.app/profile/ida-symposia.bsky.social"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/groups/13391032/"
    - label: "Facebook"
      icon: "fab fa-facebook"
      url: "https://www.facebook.com/IDAsymposia/"
  copyright: "2027 - Symposium on Intelligent Data Analysis (IDA 2027)"

sass:
  quiet_deps: true

exclude:
 - .sass-cache/
 - .jekyll-cache/
 - gemfiles/
 - Gemfile
 - Gemfile.lock
 - node_modules/
 - vendor/bundle/
 - vendor/cache/
 - vendor/gems/
 - vendor/ruby/
 - .idea/

include:
  - .nojekyll

livereload: true
baseurl: ""
url: ""
pure_relative_paths: false
